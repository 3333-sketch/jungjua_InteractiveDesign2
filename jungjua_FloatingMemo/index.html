<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%}</style>
<title>Floating Memo for Passing Thoughts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: flat geometric still life — a solid frost-glass circle resting on two midnight slabs, captions at the corners, the name set vertically on the right */
:root{
  --paper:#f2f1ee;      /* 배경: 종이 */
  --frost:#dedcf2;      /* 구슬 유리: 서리 낀 라일락 */
  --amethyst:#6b3fe0;   /* 메모 글자: 자수정 */
  --midnight:#1f1a4d;   /* 받침 · 선: 한밤 */
  --ember:#ff6b2c;      /* 데운 생각 · 강조: 구슬 속 불씨 */
  --sediment:#b9b3e6;   /* 침전층 */
  --sediment-2:#a8a1de; /* 침전층 줄무늬 */
  --mint:#dcefd8;       /* 속마음 구슬 유리 */
  --leaf:#4e8f5a;       /* 속마음 메모 글자 */
  --deep:#5b36d9;       /* 가장 오래된 침전층의 색 */
  --mute:#6f6a96;       /* 보조 글자 */
  --line:rgba(31,26,77,.18);
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-display:var(--f-ui);
  --f-pen:var(--f-ui);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.30  0 0 0 .9 -.25'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme:light;
}
[hidden]{display:none!important}
.label .sub{font-size:.6em; font-weight:500; color:var(--mute)}
html,body{height:100%; touch-action:none}
body{
  background:var(--paper); color:var(--midnight); font-family:var(--f-ui); margin:0; overflow:hidden;
  display:grid; grid-template-rows:auto 1fr auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
body::after{content:""; position:fixed; inset:0; background:var(--grain); opacity:.22; pointer-events:none; z-index:60; mix-blend-mode:multiply}

header{padding-block:28px 0; position:relative; z-index:3}
.label{margin:0; color:var(--midnight); font-size:21px; font-weight:600; line-height:1.3; letter-spacing:.04em}
.vtitle{position:fixed; top:max(28px, env(safe-area-inset-top, 0px)); right:max(28px, calc(env(safe-area-inset-right, 0px) + 16px)); margin:0; z-index:3;
  writing-mode:vertical-rl; font-family:var(--f-display); font-weight:700; font-size:clamp(40px, 7.5vh, 76px); line-height:1; letter-spacing:.12em; color:var(--midnight); pointer-events:none}

.main{display:flex; min-height:0; min-width:0}
.stage{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
#wrap{position:relative; width:min(100%, 540px, calc(100vh - 240px)); width:min(100%, 540px, calc(100dvh - 240px)); aspect-ratio:1; max-width:100%; touch-action:none; z-index:2}
.orb{position:absolute; inset:0; border-radius:50%; overflow:hidden; background:var(--frost)}
.stand{display:flex; flex-direction:column; align-items:center; margin-top:-14px; width:min(100%, 540px, calc(100vh - 240px)); width:min(100%, 540px, calc(100dvh - 240px)); position:relative; z-index:1}
.stand i{display:block; background:var(--midnight); position:relative; overflow:hidden}
/* holding the stand fills it with light from the bottom up: lower slab first, then the upper one */
.stand i::after{content:""; position:absolute; inset:0; background:#a996ff; transform:scaleY(var(--p,0)); transform-origin:bottom}
.stand i:last-child{--p:var(--p1,0)}
/* the stand is ribbed like a dial; dragging it sideways turns the ribs */

.stand i:first-child{--p:var(--p2,0)}
body.secret .stand i::after{background:#8fcf8a}
#wrap.flash .orb{filter:brightness(1.12)}
/* after the stand, the light keeps rising inside the orb up to the top */
#fill{position:absolute; left:0; right:0; bottom:0; height:calc(var(--p3,0) * 100%); background:rgba(169,150,255,.55); pointer-events:none}
#fill.drain{transition:height .7s ease}
body.secret #fill{background:rgba(143,207,138,.55)}
.stand{cursor:pointer; transition:translate .09s}
.orb{transition:background .6s, filter .5s; background:color-mix(in srgb, var(--frost), #dcefd8 calc(var(--mix,0) * 100%))}
#wrap.secret{--deep:#3e9a50; --amethyst:var(--leaf); --frost:var(--mint); --sediment:#bfdcbb; --sediment-2:#acd1a7}
body.secret{--amethyst:var(--leaf); --frost:var(--mint)}
body.secret .tmemo{color:#8fbf95}
/* green orb: title and bottom texts switch to greens with the same lightness as their violet versions */
.label,.label .sub,footer,.meta .count,button{transition:color .6s}
body.secret .label,body.secret .meta .count,body.secret button{color:#173d22}
body.secret .label .sub,body.secret footer{color:#5e8a66}
body.secret button:hover{color:var(--leaf)}
body.secret .tmemo:hover,body.secret .tmemo.dragging{color:var(--leaf)}
#wrap.secret .orb{background:color-mix(in srgb, #dcefd8, #dedcf2 calc(var(--mix,0) * 100%))}
#wrap.secret #breathInput{color:var(--leaf); border-bottom-color:var(--leaf)}
.stand.knock{translate:0 4px}
.crumbs{position:absolute; left:0; top:0; width:var(--hw); height:var(--hw); border-radius:50%; cursor:grab; touch-action:none; z-index:4; pointer-events:auto;
  transition:transform .6s cubic-bezier(.2,.8,.3,1), opacity 1.2s}
.crumbs.dragging{transition:none; cursor:grabbing}
.crumbs.fade{opacity:0}
.crumbs i{position:absolute; left:50%; top:50%; width:var(--s); height:var(--s); margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2); background:var(--amethyst); border-radius:50%;
  transition:transform .7s cubic-bezier(.2,.8,.3,1); transform:translate(0,0)}
.crumbs.spread i{transform:translate(var(--x),var(--y))}
.crumbs.gather i{transform:translate(0,0) scale(.3)}
.bub{pointer-events:none}
.bub .tx,.bub img{pointer-events:auto!important}
#trash{position:fixed; inset:0; z-index:42; background:rgba(242,241,238,.86); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); opacity:0; transition:opacity .35s; touch-action:none}
#trash.on{opacity:1}
.tmemo{position:absolute; left:0; top:0; max-width:180px; text-align:center; font-weight:500; font-size:13px; line-height:1.3; color:#9d98c6; cursor:grab; white-space:pre-line; word-break:keep-all;
  transition:transform .9s cubic-bezier(.2,.9,.25,1), opacity .6s, color .25s, filter .25s; filter:blur(.6px)}
.tmemo:hover,.tmemo.dragging{color:var(--amethyst); filter:none}
.tmemo.dragging{transition:color .25s; cursor:grabbing}
.tmemo img{max-width:90px; display:block; margin:0 auto; pointer-events:none}
.drop.dust{width:4px; height:4px; background:#9d98c6}
.stand i:first-child{width:34%; height:30px}
.stand i:last-child{width:52%; height:16px}
.sed{position:absolute; left:0; right:0; bottom:0; transition:height .5s ease; background:var(--sediment)}
.sed.hot{box-shadow:inset 0 4px 0 #7fbf6a; min-height:10%}
#wrap.secret .sed.hot{box-shadow:inset 0 4px 0 #6b3fe0}
#sedLayers{position:absolute; inset:0}
#sedLayers .layer{position:absolute; left:0; right:0; display:flex; align-items:center; justify-content:center; border-top:1px solid rgba(31,26,77,.08); cursor:grab; transition:filter .2s}
#sedLayers .layer span{display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--midnight); font-weight:400; line-height:1.2;
  opacity:calc(.4 + var(--sl,0) * .4); filter:blur(calc((1 - var(--sl,0)) * 2.5px)); transition:opacity .2s, filter .2s}
#sedLayers .layer:hover,#sedLayers .layer.grab{filter:brightness(.93)}
#wrap.secret #sedLayers .layer span{color:#2f6b3a}
#sedLayers .layer.dark span{color:#f4f1ff}
#wrap.secret #sedLayers .layer.dark span{color:#eef8ea}
#sedLayers .layer:hover span,#sedLayers .layer.grab span{opacity:1; filter:none}
#sedLabel{position:absolute; left:50%; bottom:2%; translate:-50% 0; font-size:10px; font-weight:600; color:var(--midnight); white-space:nowrap; opacity:.55}
#layer{position:absolute; inset:0; pointer-events:none}
.fogwrap{position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none}
#fog{width:100%; height:100%; transition:opacity 1.2s ease;
  -webkit-mask-image:radial-gradient(circle at var(--lx,50%) var(--ly,50%), transparent var(--lr,0px), #000 var(--lr,0px));
  mask-image:radial-gradient(circle at var(--lx,50%) var(--ly,50%), transparent var(--lr,0px), #000 var(--lr,0px))}
#lamp{display:none}
#breath{position:absolute; inset:0; width:100%; height:100%; border-radius:50%; pointer-events:none; opacity:0; transition:opacity .45s}
#wrap.writing #breath{opacity:1; animation:breathIn .55s ease-out}
#breath.fade{opacity:0!important; transition:opacity .6s}
@keyframes breathIn{from{transform:scale(.25); opacity:0}to{transform:scale(1); opacity:1}}
#trail{position:absolute; inset:-10%; width:120%; height:120%; pointer-events:none}
#links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
#wrap.cutting{cursor:pointer}

.bub{position:absolute; left:0; top:0; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0; box-sizing:border-box;
  background:transparent; color:var(--amethyst); font-family:var(--f-pen); font-weight:500; line-height:1.25; letter-spacing:-.01em; will-change:transform; cursor:grab;
  filter:blur(calc(var(--blur,0px) * (1 - var(--lit,0)))); transition:scale .45s cubic-bezier(.3,1.6,.5,1), opacity .4s, color .3s; scale:1}
.bub .tx{width:74%; font-size:var(--fs,18px); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere}
.bub img{max-width:78%; max-height:48%; display:block; margin:0 auto; pointer-events:none}
.bub .tx,.bub img{opacity:calc(.55 + var(--lit,0) * .45); filter:blur(calc((1 - var(--lit,0)) * 4.5px))}
.bub .tag{position:absolute; top:-20px; left:50%; translate:-50% 0; font-family:var(--f-ui); font-size:11px; font-weight:600; white-space:nowrap; color:var(--midnight); letter-spacing:.03em}
.bub.dragging,.bub.holding{--blur:0px!important; opacity:1!important; cursor:grabbing}
.bub.holding,.bub.hit{color:var(--midnight)}
.bub.reveal{color:var(--midnight); scale:1.08}
.bub.hit{scale:1.18}
.bub.warm{color:#ffffff}
.bub.seed{background:var(--midnight); padding:0}
.bub.seed .tx,.bub.seed img{display:none}
.bub.rubbing{--lit:1!important; color:#9d98c6; scale:1.06}
.bub.leaving{color:#7fbf6a}
#wrap.secret .bub.leaving{color:#6b3fe0}
.bub.mergeTarget{scale:1.12; color:var(--midnight)}
.bub.born{scale:.05}
.bub.pop{scale:1.5; opacity:0!important; transition:scale .22s ease-out, opacity .22s}
.bub.wipe{scale:1.6 .5; opacity:0!important; filter:blur(8px); transition:all .5s ease-out}
.bub.sink{scale:.25; opacity:0!important; filter:blur(4px); transition:all .7s ease-in}
.bub.absorb{scale:.1; opacity:0!important; transition:all .4s ease-in}
.drop{position:absolute; width:8px; height:8px; border-radius:50%; background:var(--amethyst); pointer-events:none; animation:drop .55s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0}}

#sealHint{position:absolute; left:0; top:0; font-size:12px; color:var(--midnight); letter-spacing:4px; pointer-events:none; white-space:nowrap; translate:-50% 0}
#emptyHint{position:absolute; inset:0; pointer-events:none}
#writeUI{position:absolute; left:50%; top:22%; translate:-50% 0; width:62%; display:flex; flex-direction:column; align-items:center; z-index:5}
#breathInput{width:100%; background:transparent; border:0; border-bottom:2px solid var(--midnight); color:var(--amethyst); font-family:var(--f-pen); font-weight:600; font-size:clamp(16px, 4vw, 19px); text-align:center; padding:4px 2px; outline:none; -webkit-user-select:text; user-select:text}

footer{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-block:8px max(26px, env(safe-area-inset-bottom, 0px)); position:relative; z-index:3; color:var(--mute); font-size:10.4px}
.meta{font-variant-numeric:tabular-nums; line-height:1.4; display:flex; flex-direction:column}
.meta .count{font-size:1.82em; font-weight:600; color:var(--midnight); line-height:1}
.meta b{font-weight:600; color:var(--midnight)}
.acts{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
button{font-family:var(--f-ui); font-size:10.4px; font-weight:600; color:var(--midnight); background:none; border:0; padding:2px 0; cursor:pointer; line-height:1.35}
button:hover{color:var(--amethyst)}
button:focus-visible{outline:2px solid var(--amethyst); outline-offset:3px}

.guide{position:fixed; top:0; right:0; bottom:0; width:min(360px, 100%); z-index:45; overflow:auto; box-sizing:border-box;
  background:var(--paper); border-left:2px solid var(--midnight);
  padding:32px max(24px, calc(env(safe-area-inset-right, 0px) + 16px)) calc(24px + env(safe-area-inset-bottom, 0px)) 28px;
  translate:105% 0; transition:translate .4s ease}
.guide.open{translate:0 0}
.guide h2{font-family:var(--f-display); font-weight:700; font-size:17px; margin:0 0 6px; color:var(--midnight)}
.guide>p{margin:0 0 16px; color:var(--mute); font-size:12.5px; line-height:1.55}
.guide dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:10px 14px; font-size:13px; line-height:1.4}
.guide dt{color:var(--midnight); font-weight:600}
.guide dd{margin:0; color:var(--mute)}
.guide dd em{font-style:normal; color:var(--amethyst); font-weight:600}
.guide .close{margin-top:18px}

#detail{position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(242,241,238,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:0; transition:opacity .25s; touch-action:none; padding:16px}
#detail.on{opacity:1}
.lens{position:relative; width:min(86vw, 460px); aspect-ratio:1; max-width:100%; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16%; box-sizing:border-box; overflow:hidden;
  background:var(--frost); scale:.6; transition:scale .35s cubic-bezier(.3,1.4,.5,1)}
#detail.on .lens{scale:1}
#dImg{max-width:70%; max-height:34%; position:relative; z-index:1}
#dText{position:relative; z-index:1; width:100%; flex:0 1 auto; min-height:3em; max-height:46%; background:transparent; border:0; resize:none; color:var(--amethyst); font-family:var(--f-pen); font-weight:600; font-size:19px; text-align:center; line-height:1.45; outline:none; -webkit-user-select:text; user-select:text}
#dMeta{position:relative; z-index:1; font-size:11.5px; font-weight:600; color:var(--midnight); opacity:.6; text-align:center}

@media (max-width: 600px){
  header{padding-block:20px 0}
  .label{font-size:18.2px}
  .vtitle{font-size:34px; top:20px; right:max(18px, calc(env(safe-area-inset-right, 0px) + 12px))}
  #wrap,.stand{width:min(100%, calc(100dvh - 220px))}
  footer{font-size:9.6px; padding-block:8px max(18px, env(safe-area-inset-bottom, 0px))}
  .guide{top:auto; width:100%; max-height:74%; border-left:0; border-top:2px solid var(--midnight); translate:0 105%;
    padding:24px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
  .guide.open{translate:0 0}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important; transition-duration:.01ms!important}
}
</style>
</head>
<body>


<header>
  <p class="label">Floating Memo<br><span class="sub">for Passing Thoughts</span></p>
</header>

<div class="main">
  <div class="stage">
    <div id="wrap" aria-label="수정구슬 메모 공간">
      <div class="orb">
        <div class="sed" id="sed"><div id="sedLayers"></div><span id="sedLabel"></span></div>
        <div id="fill"></div>
      </div>
      <div id="emptyHint" hidden></div>
      <canvas id="links"></canvas>
      <div id="layer"></div>
      <div class="fogwrap"><canvas id="fog"></canvas><div id="lamp"></div></div>
      <canvas id="breath"></canvas>
      <div id="writeUI" hidden>
        <input id="breathInput" type="text" maxlength="80" placeholder="" autocomplete="off" enterkeyhint="done" aria-label="메모 입력">
      </div>
      <canvas id="trail"></canvas>
      <div id="sealHint" hidden></div>
    </div>
    <div class="stand" aria-hidden="true"><i></i><i></i></div>
  </div>
</div>

<footer>
  <div class="meta"><span class="count" id="memoCount">0</span><span>구슬 속 메모</span></div>
  <div class="acts">
    <button id="dayBtn" type="button">하루 보내기</button>
  </div>
</footer>


<div id="trash" hidden></div>
<div id="detail" hidden>
  <div class="lens">
    <img id="dImg" alt="손글씨 메모" hidden>
    <textarea id="dText" rows="3" aria-label="메모 내용"></textarea>
    <div id="dMeta"></div>
  </div>
</div>
<script src="sketch.js"></script>

</body>
</html>
